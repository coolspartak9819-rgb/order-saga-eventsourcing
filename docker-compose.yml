services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGDATABASE: orders
      PGHOST: db
      PGPASSWORD: postgres
      PGUSER: postgres
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /migrations/init.sql"]
    volumes:
      - ./scripts/init.sql:/migrations/init.sql:ro

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      payment-service:
        condition: service_started
      inventory-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/orders?sslmode=disable
      PAYMENT_SERVICE_ADDR: payment-service:50051
      INVENTORY_SERVICE_ADDR: inventory-service:50052
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "4222:4222"
      - "8222:8222"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
