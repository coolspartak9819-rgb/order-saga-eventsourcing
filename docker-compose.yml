services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGDATABASE: orders
      PGHOST: db
      PGPASSWORD: postgres
      PGUSER: postgres
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /migrations/init.sql"]
    volumes:
      - ./scripts/init.sql:/migrations/init.sql:ro

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      event-bridge:
        condition: service_started
      payment-service:
        condition: service_started
      inventory-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/orders?sslmode=disable
      PAYMENT_SERVICE_ADDR: payment-service:50051
      INVENTORY_SERVICE_ADDR: inventory-service:50052
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "4222:4222"
      - "8222:8222"

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  event-bridge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: event-bridge
    depends_on:
      nats:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: orders.events

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      PAYMENT_FAIL: ${PAYMENT_FAIL:-false}

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      INVENTORY_FAIL: ${INVENTORY_FAIL:-false}
