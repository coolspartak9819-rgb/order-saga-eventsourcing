services:
  webhook-api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    security_opt:
      - no-new-privileges:true
